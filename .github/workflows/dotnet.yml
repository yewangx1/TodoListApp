$yaml = @'
name: .NET Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WpfApp1/WpfApp1.slnx

      - name: Build solution
        run: dotnet build WpfApp1/WpfApp1.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WpfApp1/WpfApp1.slnx --no-build --configuration Release --verbosity normal
'@

[System.IO.File]::WriteAllText("$PWD\.github\workflows\dotnet.yml", $yaml)